name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: DatabaseEngine
        run: cc -std=c17 -O2 -Wall -Wextra -Wpedantic -o db *.c -lpthread

      - name: Golden files
        working-directory: DatabaseEngine
        run: ./tests/run.sh ./db

      - name: Crash recovery
        working-directory: DatabaseEngine
        run: ./tests/recovery.sh ./db

      - name: Wire protocol
        working-directory: DatabaseEngine
        run: ./tests/wire.sh ./db

      - name: Readers in parallel
        working-directory: DatabaseEngine
        run: ./tests/parallel.sh ./db

  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The Windows toolchain this was written on has no working
      # -fsanitize=address, so this job is the only place the engine runs
      # under one. Every suite runs again, and the fuzzer with it.
      - name: Build instrumented
        working-directory: DatabaseEngine
        run: cc -std=c17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -o db-asan *.c -lpthread

      - name: Golden files
        working-directory: DatabaseEngine
        run: ./tests/run.sh ./db-asan

      - name: Crash recovery
        working-directory: DatabaseEngine
        run: ./tests/recovery.sh ./db-asan

      - name: Wire protocol
        working-directory: DatabaseEngine
        run: ./tests/wire.sh ./db-asan

      - name: Fuzz SQL
        working-directory: DatabaseEngine
        run: python3 tests/fuzz.py sql --exe ./db-asan --runs 200 --seed 1

      - name: Fuzz wire
        working-directory: DatabaseEngine
        run: python3 tests/fuzz.py wire --exe ./db-asan --runs 100 --seed 1

  races:
    name: Linux (ThreadSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The engine serves a thread per connection, and the toolchain it was
      # written on has no working sanitizer of any kind - so this job is the
      # only place a data race is actually looked for rather than reasoned
      # about. The concurrency checks in wire.py are what drive it: several
      # connections reading at once, a transaction blocking them, and USE
      # moving one session and not the others.
      - name: Build instrumented
        working-directory: DatabaseEngine
        run: cc -std=c17 -O1 -g -fsanitize=thread -fno-omit-frame-pointer -o db-tsan *.c -lpthread

      - name: Protocol and concurrency
        working-directory: DatabaseEngine
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: ./tests/wire.sh ./db-tsan

      - name: Readers in parallel
        working-directory: DatabaseEngine
        env:
          TSAN_OPTIONS: halt_on_error=1
          ROWS: "400"
        run: ./tests/parallel.sh ./db-tsan

  macos:
    name: macOS (clang)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: DatabaseEngine
        run: cc -std=c17 -O2 -Wall -Wextra -o db *.c -lpthread

      - name: Golden files
        working-directory: DatabaseEngine
        run: ./tests/run.sh ./db

      - name: Crash recovery
        working-directory: DatabaseEngine
        run: ./tests/recovery.sh ./db

      - name: Wire protocol
        working-directory: DatabaseEngine
        run: ./tests/wire.sh ./db

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild DatabaseEngine/DatabaseEngine.vcxproj /p:Configuration=Debug /p:Platform=x64

      - name: Golden files
        working-directory: DatabaseEngine
        shell: bash
        run: ./tests/run.sh ./x64/Debug/DatabaseEngine.exe
